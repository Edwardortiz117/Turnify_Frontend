# Turnify — frontend prod local (mismo Dockerfile que CapRover).
#
#   cp .env.docker.example .env   # opcional
#   docker compose up --build
#   → http://localhost:8080

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: turnify-frontend:local
    container_name: turnify-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_SCHEME: ${BACKEND_SCHEME:-http}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - turnify-net
    restart: unless-stopped

networks:
  turnify-net:
    name: turnify-net
    driver: bridge
