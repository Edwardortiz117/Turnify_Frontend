# Turnify — frontend contenedorizado, desacoplado del backend.
#
# Desarrollo (HMR, sin rebuild al editar):
#   docker compose up --build
#   → http://localhost:5173
#
# Producción local (Nginx + build estático):
#   docker compose --profile prod up --build frontend-prod
#   → http://localhost:8080

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: turnify-frontend:dev
    container_name: turnify-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      DOCKER: "1"
      # Vacío = same-origin vía proxy Vite → host.docker.internal
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://host.docker.internal:3000}
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - turnify-net
    stdin_open: true
    tty: true

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: turnify-frontend:local
    container_name: turnify-frontend-prod
    ports:
      - "${FRONTEND_PROD_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - turnify-net
    restart: unless-stopped

networks:
  turnify-net:
    name: turnify-net
    driver: bridge

volumes:
  frontend_node_modules:
